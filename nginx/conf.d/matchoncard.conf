# Contexto http (Ubuntu lo incluye desde /etc/nginx/conf.d/). Copiar a /etc/nginx/conf.d/matchoncard.conf
server_tokens off;

# Los links de captura llevan el token en la ruta (/captura/<token>): no se escribe en los logs.
map $request_uri $matchoncard_uri {
    "~^(?<mc_antes>.*/captura/)[A-Za-z0-9_-]+(?<mc_despues>.*)$" "${mc_antes}[token]${mc_despues}";
    default $request_uri;
}

# Igual que "combined", pero con la ruta filtrada. No registra cookies ni Authorization.
log_format matchoncard '$remote_addr - [$time_local] "$request_method $matchoncard_uri $server_protocol" '
                       '$status $body_bytes_sent $request_time "$http_referer" "$http_user_agent"';
