# API pública (/v1, /health) en el contenedor "api" (127.0.0.1:4560) y links de captura (/captura/<token>), que son
# la página de Next del contenedor "app" (127.0.0.1:4561). Debe coincidir con PUBLIC_URL de api/.env.production.
# Certificado: ver api/CERTIFICADOS.md

server {
    listen 80;
    listen [::]:80;
    server_name api.matchoncard.cl;
    access_log /var/log/nginx/matchoncard-api.access.log matchoncard;
    include snippets/matchoncard-acme.conf;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.matchoncard.cl;
    ssl_certificate /etc/letsencrypt/live/api.matchoncard.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.matchoncard.cl/privkey.pem;
    include snippets/matchoncard-ssl.conf;

    access_log /var/log/nginx/matchoncard-api.access.log matchoncard;
    error_log /var/log/nginx/matchoncard-api.error.log warn;

    # POST /v1/documentos lleva el PDF en base64 (límite de la API: 36 MB)
    client_max_body_size 40m;

    # la portada del subdominio lleva a la landing
    location = / {
        return 302 https://matchoncard.cl/;
    }

    # la página de captura es de Next (app); sus llamadas a /v1/captura van directo a la API
    location ^~ /captura/ {
        proxy_pass http://127.0.0.1:4561;
        include snippets/matchoncard-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:4560;
        include snippets/matchoncard-proxy.conf;
    }
}
