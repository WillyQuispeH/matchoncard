# Corta las solicitudes por IP o con un dominio que no es nuestro. Reemplaza al sitio "default" de Ubuntu.
# Responde el desafío de Let's Encrypt para cualquier dominio: así se puede sacar el certificado de un sitio
# antes de activarlo.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include snippets/matchoncard-acme.conf;
    location / {
        return 444;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}
