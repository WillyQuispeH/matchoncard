# app-admin (Next.js, contenedor "app-admin" en 127.0.0.1:4564): clientes, usuarios, validaciones, documentos,
# webhooks y auditoría. Reenvía /admin/api a la API por la red interna.
# Certificado: ver app-admin/CERTIFICADOS.md

server {
    listen 80;
    listen [::]:80;
    server_name admin.matchoncard.cl;
    access_log /var/log/nginx/matchoncard-admin.access.log matchoncard;
    include snippets/matchoncard-acme.conf;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.matchoncard.cl;
    ssl_certificate /etc/letsencrypt/live/admin.matchoncard.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.matchoncard.cl/privkey.pem;
    include snippets/matchoncard-ssl.conf;

    access_log /var/log/nginx/matchoncard-admin.access.log matchoncard;
    error_log /var/log/nginx/matchoncard-admin.error.log warn;

    # Recomendado: solo la IP de la oficina o de la VPN.
    # allow 200.1.2.3;
    # deny all;

    # subida de PDF desde el panel (límite de la API: 36 MB)
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:4564;
        include snippets/matchoncard-proxy.conf;
    }
}
