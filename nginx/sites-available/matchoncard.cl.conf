# app (Next.js, contenedor "app" en 127.0.0.1:4561): landing, /demo y /verificar
# Certificado: ver app/CERTIFICADOS.md

server {
    listen 80;
    listen [::]:80;
    server_name matchoncard.cl www.matchoncard.cl;
    access_log /var/log/nginx/matchoncard.access.log matchoncard;
    include snippets/matchoncard-acme.conf;
    location / {
        return 301 https://matchoncard.cl$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.matchoncard.cl;
    ssl_certificate /etc/letsencrypt/live/matchoncard.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matchoncard.cl/privkey.pem;
    include snippets/matchoncard-ssl.conf;
    access_log /var/log/nginx/matchoncard.access.log matchoncard;
    return 301 https://matchoncard.cl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matchoncard.cl;
    ssl_certificate /etc/letsencrypt/live/matchoncard.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matchoncard.cl/privkey.pem;
    include snippets/matchoncard-ssl.conf;

    access_log /var/log/nginx/matchoncard.access.log matchoncard;
    error_log /var/log/nginx/matchoncard.error.log warn;

    # /verificar/api recibe el PDF crudo (máx. 26 MB)
    client_max_body_size 30m;

    # el panel se mudó a app-admin
    location ^~ /panel {
        return 301 https://admin.matchoncard.cl/;
    }

    location / {
        proxy_pass http://127.0.0.1:4561;
        include snippets/matchoncard-proxy.conf;
    }
}
