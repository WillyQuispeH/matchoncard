# Reenvío a un contenedor Next (app o app-admin). Copiar a /etc/nginx/snippets/
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Se reemplaza (no se agrega) para que el visitante no pueda falsear su IP; la API confía solo en los saltos de Docker.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# La firma de un PDF puede tardar hasta 130 s (timeout del proxy de Next).
proxy_connect_timeout 10s;
proxy_send_timeout 150s;
proxy_read_timeout 150s;
# Los PDF (hasta 36 MB en base64) pasan por streaming hasta la API.
proxy_request_buffering off;

# HSTS en todas las respuestas, no solo en las páginas que lo declaran en next.config.ts
proxy_hide_header Strict-Transport-Security;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
